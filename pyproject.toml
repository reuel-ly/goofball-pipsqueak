[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "goofball-pipsqueak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
    "kokoro>=0.9.4",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.34.0",
    "webrtcvad-wheels>=2.0.14",
    "pywebview>=5.0",
]

[project.scripts]
pipsqueak-web = "src.frontend.server:main"
pipsqueak-desktop = "src.frontend.desktop:main"
