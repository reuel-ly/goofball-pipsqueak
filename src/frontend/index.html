<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipsqueak Agent</title>
  <link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
  <div id="titlebar" class="titlebar hidden">
    <span class="titlebar-title">Pipsqueak</span>
    <button id="close-btn" class="close-btn" title="Close">✕</button>
  </div>

  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <h1>Pipsqueak</h1>
      <p id="loading-message">Loading models…</p>
      <div class="loading-spinner" aria-hidden="true"></div>
    </div>
  </div>

  <div class="app">
    <section id="chat-panel" class="chat-panel">
      <header>
        <h1>Pipsqueak</h1>
        <span id="status" class="status idle">Idle</span>
      </header>

      <div id="caption" class="caption hidden"></div>

      <div id="level-wrap" class="level-wrap hidden" aria-hidden="true">
        <div id="level-fill" class="level-fill"></div>
      </div>

      <main id="transcript" class="transcript"></main>

      <footer class="input-bar">
        <button id="mic-btn" type="button" title="Push to talk">🎤</button>
        <input id="text-input" type="text" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn" type="button">Send</button>
      </footer>
    </section>

    <div id="character-stage" class="character-stage hidden">
      <img id="character-img" src="/assets/idle.gif" alt="Pipsqueak">
    </div>
  </div>

  <script src="/app.js?v=5"></script>
</body>
</html>
